name: Build and deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ github.event_name == 'schedule' && 'requirements.txt' || 'requirements-dev.txt' }}
      - name: Install bounded scheduled dependencies
        if: github.event_name == 'schedule'
        run: python -m pip install -r requirements.txt
      - name: Install release gate dependencies
        if: github.event_name != 'schedule'
        run: python -m pip install -r requirements-dev.txt
      - name: Set up Node 24 for release gates
        if: github.event_name != 'schedule'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          package-manager-cache: false
      - name: Run release Python tests
        if: github.event_name != 'schedule'
        run: python -m pytest
      - name: Validate frozen configuration
        run: python -m pipeline.main --validate-config
      - name: Audit Python runtime dependencies
        if: github.event_name != 'schedule'
        run: python -m pip_audit -r requirements.txt
      - name: Run release JavaScript tests
        if: github.event_name != 'schedule'
        run: npm test
      - name: Generate the live ArticleDataset
        run: python -m pipeline.main
      - name: Assemble the allowlisted Pages artifact
        run: python scripts/build_pages.py
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: .build/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
