<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'none'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"
    >
    <title>Intentional Reading</title>
    <link rel="stylesheet" href="./css/app.css">
  </head>
  <body>
    <a class="skip-link" href="#app-view">Skip to reading content</a>

    <div class="app-shell" id="app-shell">
      <header class="masthead" aria-label="Application header">
        <p class="brand" aria-label="Intentional Reading">Intentional Reading</p>
        <nav
          class="primary-navigation"
          id="primary-navigation"
          aria-label="Primary navigation"
        ></nav>
        <button
          class="settings-button"
          id="settings-toggle"
          type="button"
          aria-label="Open Settings"
          aria-haspopup="dialog"
          aria-controls="settings-dialog"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24" width="23" height="23">
            <path d="M12 8.25A3.75 3.75 0 1 0 12 15.75 3.75 3.75 0 0 0 12 8.25Z"></path>
            <path d="M19.2 13.5a7.5 7.5 0 0 0 .04-3l1.72-1.34-2-3.46-2.04.82a7.6 7.6 0 0 0-2.6-1.5L14 2.85h-4l-.32 2.17a7.6 7.6 0 0 0-2.6 1.5L5.04 5.7l-2 3.46 1.72 1.34a7.5 7.5 0 0 0 .04 3l-1.76 1.34 2 3.46 2.07-.83a7.6 7.6 0 0 0 2.57 1.48L10 21.15h4l.32-2.2a7.6 7.6 0 0 0 2.57-1.48l2.07.83 2-3.46L19.2 13.5Z"></path>
          </svg>
        </button>
      </header>

      <main class="view-root" id="app-view" tabindex="-1"></main>
    </div>

    <dialog class="settings-dialog" id="settings-dialog" aria-labelledby="settings-title"></dialog>
    <div class="toast-region" id="toast-region" aria-live="polite"></div>
    <div class="visually-hidden" id="app-status" role="status" aria-live="polite" aria-atomic="true"></div>

    <noscript>
      <p class="noscript-message">Intentional Reading requires JavaScript to present your local reading queue.</p>
    </noscript>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
